name: Build Windows - Crash Native e Port GBA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-build.yml"
      - "build-input/**"
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validar fontes sem ROM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path 'build-input/Crash-Windows-Source.zip')) { throw 'Falta build-input/Crash-Windows-Source.zip (nao inclua arquivos .gba)' }
          Expand-Archive 'build-input/Crash-Windows-Source.zip' 'work' -Force
          # Overlay tested Port GBA v2.14.0 sources (no ROM or generated game code).
          $overlay = (Get-Content 'build-input/PortGBA-v2.14.0-CI-overlay.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes('portgba-overlay.zip',[Convert]::FromBase64String($overlay))
          Expand-Archive 'portgba-overlay.zip' 'work/PortGBA' -Force
          foreach ($p in @('work/Crash/src/game_win32.cpp','work/Crash/src/png.cpp','work/PortGBA/CMakeLists.txt')) {
            if (!(Test-Path $p)) { throw "Fonte ausente: $p" }
          }
          $roms = @(Get-ChildItem work -Recurse -File | Where-Object { $_.Extension -in @('.gba','.sfc','.smc','.srm') })
          if ($roms.Count -gt 0) { throw 'ROMs e saves nao podem ser publicados.' }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compilar CrashNative.exe
        shell: cmd
        run: |
          cl /nologo /utf-8 /std:c++17 /EHsc /O2 /MT /Iwork\Crash\src work\Crash\src\game_win32.cpp work\Crash\src\png.cpp /Fe:CrashNative.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib winmm.lib
          if errorlevel 1 exit /b 1
          if not exist CrashNative.exe exit /b 2
      - name: Compilar e testar Builder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S work/PortGBA -B build-builder -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake do Builder falhou' }
          cmake --build build-builder --config Release --parallel 3
          if ($LASTEXITCODE -ne 0) { throw 'Compilacao do Builder falhou' }
          ctest --test-dir build-builder -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Testes do Builder falharam' }
      - name: Criar ZIPs portateis
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $game = 'out/CrashNative-Windows-x64'
          $builder = 'out/PortGBABuilder-Windows-x64'
          New-Item -ItemType Directory -Force -Path $builder | Out-Null
          & 'build-builder/Release/PortGBABuilder.exe' package-windows CrashNative.exe $game --rom crash.gba
          if ($LASTEXITCODE -ne 0) { throw 'Port GBA nao conseguiu validar o executavel ou preparar distribuicao' }
          Copy-Item work/Crash/display.ini "$game/display.ini"
          New-Item -ItemType Directory -Force -Path "$game/assets/overrides" | Out-Null
          'Coloque nesta pasta substituicoes graficas opcionais.' | Set-Content "$game/assets/overrides/LEIA-ME.txt" -Encoding utf8
          Copy-Item build-builder/Release/PortGBABuilder.exe "$builder/PortGBABuilder.exe"
          'Port GBA Builder v2.14.0: ferramentas de traducao e empacotamento. Nao e um jogo.' | Set-Content "$builder/LEIA-ME.txt" -Encoding utf8
          'Builder generico GBA. Nao e o jogo. O runtime original do Crash ainda e experimental.' | Set-Content "$builder/LEIA-ME.txt" -Encoding utf8
          if (!(Test-Path "$game/CrashNative.exe")) { throw 'CrashNative.exe nao foi produzido' }
          if (!(Test-Path "$builder/PortGBABuilder.exe")) { throw 'PortGBABuilder.exe nao foi produzido' }
          Write-Host "Distribuicao pronta: pastas portateis com os executaveis. O GitHub compactara cada pasta em um unico artifact ZIP."
          Get-FileHash "$game/CrashNative.exe" -Algorithm SHA256 | Format-List
          Get-FileHash "$builder/PortGBABuilder.exe" -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: CrashNative-Windows-x64
          path: out/CrashNative-Windows-x64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PortGBABuilder-Windows-x64
          path: out/PortGBABuilder-Windows-x64/
          if-no-files-found: error
      - name: Testar seletor do modo hibrido
        shell: cmd
        run: |
          cl /nologo /utf-8 /std:c++17 /EHsc /O2 /MT hybrid\tests\mode_test.cpp /Fe:HybridModeSelfTest.exe /link /SUBSYSTEM:CONSOLE
          if errorlevel 1 exit /b 1
          HybridModeSelfTest.exe
          if errorlevel 1 exit /b 1
      - name: Compilar ROM Original experimental (opcional - somente repositorio privado)
        if: github.event.repository.private == true && hashFiles('build-input/Crash-Experimental-Generated.zip') != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'build-input/Crash-Experimental-Generated.zip'
          if (!(Test-Path $archive)) { Write-Host 'Sem fonte C++ experimental; skip.'; exit 0 }
          Expand-Archive $archive 'work/Experimental' -Force
          if (!(Test-Path 'work/Experimental/CMakeLists.txt')) { throw 'ZIP experimental sem CMakeLists.txt na raiz' }
          $roms = @(Get-ChildItem work/Experimental -Recurse -File | Where-Object { $_.Extension -in @('.gba','.sfc','.smc','.srm') })
          if ($roms.Count -gt 0) { throw 'Nao inclua ROM nem save no ZIP experimental.' }
          cmake -S work/Experimental -B build-experimental -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake experimental falhou' }
          cmake --build build-experimental --config Release --target ACQE_ROM_Window --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Build experimental falhou' }
          $dst='out/Crash-ROM-Original-Experimental'
          New-Item -ItemType Directory -Force -Path $dst, "$dst/input" | Out-Null
          Copy-Item build-experimental/Release/ACQE_ROM_Window.exe "$dst/ACQE_ROM_Window.exe"
          'Experimental: coloque sua ROM legitima em input/crash.gba. Gameplay completo nao validado.' | Set-Content "$dst/LEIA-ME.txt" -Encoding utf8
          Compress-Archive -Path $dst -DestinationPath out/Crash-ROM-Original-Experimental.zip -Force
      - uses: actions/upload-artifact@v4
        if: github.event.repository.private == true && hashFiles('build-input/Crash-Experimental-Generated.zip') != ''
        with:
          name: Crash-ROM-Original-Experimental-Windows-x64
          path: out/Crash-ROM-Original-Experimental.zip
          if-no-files-found: error
      - name: Compilar CrashHybrid.exe (dois motores no mesmo processo, opcional)
        if: github.event.repository.private == true && hashFiles('build-input/Crash-Experimental-Generated.zip') != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rebuilt = (Resolve-Path 'work/Crash').Path
          $original = (Resolve-Path 'work/Experimental').Path
          cmake -S hybrid -B build-hybrid -G "Visual Studio 17 2022" -A x64 "-DCRASH_REBUILT_DIR=$rebuilt" "-DCRASH_ORIGINAL_DIR=$original"
          if ($LASTEXITCODE -ne 0) { throw 'Falhou a configuracao do CrashHybrid' }
          cmake --build build-hybrid --config Release --target CrashHybrid --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Falhou a compilacao do CrashHybrid' }
          $exe = 'build-hybrid/Release/CrashHybrid.exe'
          if (!(Test-Path $exe)) { throw 'CrashHybrid.exe ausente' }
          $dst='out/CrashHybrid-Windows-x64'
          New-Item -ItemType Directory -Force -Path $dst, "$dst/input", "$dst/save", "$dst/assets/overrides" | Out-Null
          Copy-Item $exe "$dst/CrashHybrid.exe"
          Copy-Item 'work/Crash/display.ini' "$dst/display.ini"
          'Coloque sua ROM legitima em input/crash.gba. Ao abrir CrashHybrid.exe selecione SIM (ROM original experimental) ou NAO (motor reconstruido). Ainda nao ha troca automatica de estado nem conclusao de fase validada.' | Set-Content "$dst/LEIA-ME.txt" -Encoding utf8
          'Coloque aqui a sua copia legitima da ROM como crash.gba.' | Set-Content "$dst/input/COLOQUE-ROM-AQUI.txt" -Encoding utf8
          'Os modos ainda nao compartilham o mesmo formato de save.' | Set-Content "$dst/save/LEIA-ME.txt" -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: github.event.repository.private == true && hashFiles('build-input/Crash-Experimental-Generated.zip') != ''
        with:
          name: CrashHybrid-Windows-x64
          path: out/CrashHybrid-Windows-x64/
          if-no-files-found: error

